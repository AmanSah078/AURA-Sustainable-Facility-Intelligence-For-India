# =============================================================================
# AURA Spring Boot Application Configuration
# Module: Energy & Core Facilities Layer
# =============================================================================

spring.application.name=aura-backend
server.port=8080

# Database Configuration (supports environment variables with safe defaults)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aura_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:AURA@MySQL2026}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate Configuration
# Validates entity mapping against existing tables without dropping or altering schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson Date Formatting
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=UTC

# =============================================================================
# Python FastAPI AI Service Integration
# =============================================================================
ai.service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
ai.service.connect-timeout-ms=${AI_SERVICE_CONNECT_TIMEOUT_MS:3000}
ai.service.read-timeout-ms=${AI_SERVICE_READ_TIMEOUT_MS:5000}

